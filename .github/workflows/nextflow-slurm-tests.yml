# Runs the nextflow test suite against a real SLURM cluster.
# We manually triggered it because it is slower and flakier than the
# local-executor nextflow tests run on every push/PR.

name: Nextflow SLURM tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextflow-tests-slurm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        nextflow-version: [25.10.4]
        java-version: [21]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "8888:3306"
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v2
    - uses: koesterlab/setup-slurm-action@v1
    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '${{ matrix.java-version }}'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies ${{ matrix.nextflow-version }}
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python setup.py install
        # Install Nextflow
        mkdir /tmp/nextflow && cd /tmp/nextflow
        wget -qO- https://github.com/nextflow-io/nextflow/releases/download/v${{ matrix.nextflow-version }}/nextflow-${{ matrix.nextflow-version }}-dist > nextflow
        chmod +x nextflow
        echo "/tmp/nextflow" >> $GITHUB_PATH
        cd -
        # Build java dependencies
        tests/nextflow-tests/build_tests.sh
    - name: Use Slurm executor for Nextflow tests
      run: cp tests/nextflow-tests/nextflow_slurm.config tests/nextflow-tests/nextflow.config
    - name: Test nextflow workflows
      run: |
        # Run nextflow tests
        tests/nextflow-tests/run_all_tests.sh
